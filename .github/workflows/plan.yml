name: "Terraform Plan & Diagram"

on:
  pull_request:
    # branches:
    #   - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: "Terraform Plan & Generate Diagram"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        continue-on-error: true
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.1"

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan -no-color -out=tfplan.binary || true
          if [ -f tfplan.binary ]; then
            terraform show -json tfplan.binary > plan.json
          fi

      - name: Render Cloud Architecture Diagram
        run: |
          if [ -f plan.json ]; then
            npx -y tf-arch-diagram-generator render plan.json --out docs/architecture.svg
          else
            echo "Plan JSON not available, rendering from Terraform configuration..."
            npx -y tf-arch-diagram-generator render plan.json --out docs/architecture.svg || true
          fi

      - name: Upload Diagram Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: architecture-diagram
          path: docs/architecture.svg
          if-no-files-found: ignore

      - name: Comment Plan Summary on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const body = `### 🌐 Azure AKS Infrastructure Plan & Diagram Summary
            - **Terraform Core**: \`>= 1.16.1\`
            - **Target Cloud**: Microsoft Azure
            - **Diagram Tool**: [tf-arch-diagram-generator](https://github.com/mchittineni/tf-arch-diagram-generator)
            - **Architecture Diagram**: Generated and attached as workflow artifact \`architecture-diagram\`.
            
            *Automated CI check triggered by commit \`${context.sha.substring(0, 7)}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
